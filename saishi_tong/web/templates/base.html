<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="赛事通：浏览本地收录的中文开发者赛事、黑客松与征文。每条线索都有来源和检索时间。">
  <title>{% block title %}赛事通 · 中文开发者赛历{% endblock %}</title>
  <link rel="icon" href="/static/favicon.png?v={{ version }}" type="image/png" sizes="32x32">
  <link rel="icon" href="/static/favicon-16.png?v={{ version }}" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v={{ version }}">
  <link rel="stylesheet" href="/static/style.css?v={{ version }}">
  <script src="/static/app.js?v={{ version }}" defer></script>
  {% if active == 'home' %}<script type="module" src="/static/online.js?v={{ version }}"></script>{% endif %}
  {% if active == 'admin' %}<script src="/static/admin.js?v={{ version }}" defer></script>{% endif %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main">跳到主要内容</a>
  <div class="shell">
    <header class="site-header">
      <a class="brand" href="/" aria-label="赛事通首页"><img class="brand-logo" src="/static/logo-transparent.png?v={{ version }}" width="36" height="36" alt="赛事通"><span>赛事通<small>开发者的下一场</small></span></a>
      <nav class="main-nav" aria-label="主导航">
        <a href="/" {% if active == 'home' %}aria-current="page"{% endif %}>发现</a>
        <a href="/contests" {% if active == 'contests' %}aria-current="page"{% endif %}>赛事目录 <span class="nav-label">访客可看</span></a>
        <div class="nav-settings"><a href="/settings" {% if active == 'settings' %}aria-current="page"{% endif %}>设置</a><details class="nav-dropdown" id="settings-dropdown"><summary aria-label="设置菜单" title="展开设置菜单"><span aria-hidden="true">⌄</span></summary><nav class="nav-dropdown-panel" aria-label="设置快捷入口"><a href="/admin" {% if active == 'admin' %}aria-current="page"{% endif %}>管理员 <span aria-hidden="true">↗</span></a></nav></details></div>
      </nav>
    </header>
    <main id="main" tabindex="-1">{% block content %}{% endblock %}</main>
    <footer class="site-footer">
      <div><a class="footer-brand" href="/">赛事通<span class="accent">.</span></a><p>找到值得投入的下一场。<br>本地赛事目录 × 可追溯来源</p></div>
      <p class="footer-note">赛事情报不等于报名承诺。截止、奖励与主办信息可能为启发式提取，<br class="desktop-only">请到原始来源核验；不代报名，不提供组队服务。<br><span>网站 MVP · v{{ version }}</span></p>
    </footer>
  </div>
</body>
</html>
